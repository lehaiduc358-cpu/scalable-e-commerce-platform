spring:
  application:
    name: ecommerce
  config:
    import: "optional:file:.env[.properties]"
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

    spring.jpa.hibernate.ddl-auto: none
    spring.jpa.show-sql: true
